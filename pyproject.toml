[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.1.0"
description = "The production hand-offs of the evidence spine: TIE to the kernel, the kernel to the gateway, the document to CCC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Each dependency is pinned to an exact commit, so every install gets the same code. Spine is the one place that
# imports them together; none of them imports another. Moving a pin is a deliberate, reviewed change.
dependencies = [
    "herald @ git+https://github.com/wking53214/HERALD.git@2defe0d4069d7087f153ad4acc1833d2aca7250c",
    "tie-transcript-intelligence-engine @ git+https://github.com/wking53214/TIE.git@05fbc47391b76fd83794d96b0225cc30324be398",
    "conservation-kernel @ git+https://github.com/wking53214/Conservation_Kernel.git@b1b61fb56556e4047d125f5fe44333440e8c1c32",
    "governance-gateway @ git+https://github.com/wking53214/Governance_Gateway.git@9135995111f801b24a3fa11f16e3fd760de1d83e",
    "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC.git@d77c23c1cab2ed436e194100a8386b275740b556",
    "cns @ git+https://github.com/wking53214/CNS.git@0015e5bcb9756a81138b2af4e5c9e4dca0106fc8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=42", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
