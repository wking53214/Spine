[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.1.0"
description = "The production hand-offs of the evidence spine: TIE to the kernel, the kernel to the gateway, the document to CCC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Each dependency is pinned to an exact commit, so every install gets the same code. Spine is the one place that
# imports them together; none of them imports another. Moving a pin is a deliberate, reviewed change.
dependencies = [
    "herald @ git+https://github.com/wking53214/HERALD.git@bd2908dedf6da1b95e41e377a46be10d7a772ae7",
    "tie-transcript-intelligence-engine @ git+https://github.com/wking53214/TIE.git@5465268bd1ff5f1a536fb481ff5187dd7f0d9bfd",
    "conservation-kernel @ git+https://github.com/wking53214/Conservation_Kernel.git@32e6a19729eb9d4fb367b0c666f5e0ee633d59cf",
    "governance-gateway @ git+https://github.com/wking53214/Governance_Gateway.git@1e9a06465aab70098e50f3c5e71e74d6fa310b66",
    "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC.git@f1710d60bd850b566db616900791c56a09fc17a1",
    "cns @ git+https://github.com/wking53214/CNS.git@d085e5f92874e90978d401a19497f399766a4d18",
]

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=42", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
