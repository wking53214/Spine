[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.1.0"
description = "The production hand-offs of the evidence spine: TIE to the kernel, the kernel to the gateway, the document to CCC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Each dependency is pinned to an exact commit, so every install gets the same code. Spine is the one place that
# imports them together; none of them imports another. Moving a pin is a deliberate, reviewed change.
dependencies = [
    "herald @ git+https://github.com/wking53214/HERALD.git@75c17ef3ad679f5a44b031cc8da55cd20c956215",
    "tie-transcript-intelligence-engine @ git+https://github.com/wking53214/TIE.git@9d3ad38de169e2ce1794e577c240e89cba8ca027",
    "conservation-kernel @ git+https://github.com/wking53214/Conservation_Kernel.git@cc42d3fc57dec0dd71aabd478b9585d2852a793e",
    "governance-gateway @ git+https://github.com/wking53214/Governance_Gateway.git@5dead3cc1e6cf456a5974d2248b0e3a1c9d43631",
    "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC.git@2379de87247aeb31c01f767c52cd462adc0f540d",
    "cns @ git+https://github.com/wking53214/CNS.git@64c68b50382a69deaf602e62ad26cb3988c57326",
]

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=42", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
