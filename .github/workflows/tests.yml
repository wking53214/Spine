name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A normal, non-editable install of the pinned packages: the tests run against exactly the commits named in
      # pyproject.toml, not against whatever is on a developer's path.
      - run: pip install ".[dev]"
      - run: pytest -q
